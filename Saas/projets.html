<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid+ — Mes projets</title>
  <meta name="description" content="Sélectionnez le projet sur lequel vous souhaitez travailler." />
  <link rel="icon" href="favicon.svg?v=5" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=7" />
  <link rel="stylesheet" href="theme.css?v=4" />
  <style>
    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Libre Franklin', sans-serif;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .projects-header {
      padding: 40px 28px 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .projects-header__top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .projects-header__logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .btn-logout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-logout svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .projects-header__logo img {
      height: 32px;
      width: auto;
    }

    .projects-header__logo-text {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #fff;
    }

    .projects-header__page-title {
      font-family: 'Archivo', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      color: #fff;
      margin-left: 16px;
    }

    .projects-container {
      flex: 1;
      padding: 20px 28px 60px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .projects-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .btn-new-project {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-family: 'Archivo', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border: 2px solid;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
    }

    .btn-new-project--preference {
      border-color: #86efac;
    }

    .btn-new-project--preference:hover {
      background: #f0fdf4;
      border-color: #4ade80;
    }

    .btn-new-project--bsaair {
      border-color: #60a5fa;
    }

    .btn-new-project--bsaair:hover {
      background: #eff6ff;
      border-color: #3b82f6;
    }

    .btn-new-project--ordinary {
      border-color: #1e40af;
    }

    .btn-new-project--ordinary:hover {
      background: #eff6ff;
      border-color: #1e3a8a;
    }

    .btn-new-project:active {
      transform: scale(0.97);
    }

    .btn-new-project svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .project-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      text-decoration: none;
      color: #08090c;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      border-color: #15803d;
    }

    .project-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .project-card__badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1;
    }

    .project-card__type {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'Archivo', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .project-card__type--raise {
      background: #d1fae5;
      color: #15803d;
    }

    .project-card__type--bsaair {
      background: #dbeafe;
      color: #1e40af;
    }

    .project-card__type--ordinary {
      background: #e9d5ff;
      color: #7c3aed;
    }

    .project-card__menu {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #6b6b78;
      transition: background 0.15s, color 0.15s;
    }

    .project-card__menu:hover {
      background: #f0f1f3;
      color: #08090c;
    }

    .project-card__menu svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .project-menu {
      position: fixed;
      z-index: 1200;
      min-width: 190px;
      background: #fff;
      border: 1px solid rgba(8, 9, 12, 0.14);
      border-radius: 12px;
      box-shadow: 0 18px 44px rgba(8, 9, 12, 0.28);
      padding: 6px;
      animation: project-menu-in 0.12s ease;
    }

    @keyframes project-menu-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }

    .project-menu__item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border: 0;
      background: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Libre Franklin', sans-serif;
      font-size: 14px;
      color: #08090c;
      text-align: left;
    }

    .project-menu__item:hover {
      background: #f2f0ea;
    }

    .project-menu__item svg {
      width: 16px;
      height: 16px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      color: #6b6b78;
    }

    .project-menu__item--danger {
      color: #dc2626;
    }

    .project-menu__item--danger svg {
      color: #dc2626;
    }

    .project-menu__item--danger:hover {
      background: rgba(220, 38, 38, 0.08);
    }

    .project-card__name {
      font-family: 'Archivo', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
      color: #08090c;
    }

    .project-card__meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: #6b6b78;
    }

    .project-card__meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .project-card__meta-item svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      flex: none;
    }

    .project-card__progress {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(8, 9, 12, 0.08);
    }

    .project-card__progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #6b6b78;
      margin-bottom: 8px;
    }

    .project-card__progress-bar {
      height: 6px;
      background: #f0f1f3;
      border-radius: 999px;
      overflow: hidden;
    }

    .project-card__progress-fill {
      height: 100%;
      background: #15803d;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }

    .empty-state__icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      opacity: 0.4;
    }

    .empty-state__title {
      font-family: 'Archivo', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      margin: 0 0 8px;
    }

    .empty-state__text {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.6);
      margin: 0 0 24px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
    }

    .error-message {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      color: #fca5a5;
      font-size: 14px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .projects-grid {
        grid-template-columns: 1fr;
      }

      .projects-header__title {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="projects-header">
    <div class="projects-header__top">
      <a class="projects-header__logo" href="index.html">
        <img src="/ressourcegraphique/Goutte%20blanche.png" alt="" />
        <span class="projects-header__logo-text">LIQUID+</span>
        <span class="projects-header__page-title">Mes projets</span>
      </a>
      <button class="btn-logout" id="btn-logout">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <path d="M16 17l5-5-5-5"></path>
          <path d="M21 12H9"></path>
        </svg>
        Déconnexion
      </button>
    </div>
  </div>

  <div class="projects-container">
    <div class="projects-actions">
      <button class="btn-new-project btn-new-project--preference" id="btn-new-raise-preference">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Levée avec actions de préférence
      </button>
      <button class="btn-new-project btn-new-project--bsaair" id="btn-new-bsaair">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Levée avec BSA AIR
      </button>
      <button class="btn-new-project btn-new-project--ordinary" id="btn-new-raise-ordinary">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Levée avec actions ordinaires
      </button>
    </div>

    <div id="error-container"></div>
    <div id="projects-list">
      <div class="loading">Chargement de vos projets...</div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const projectsList = document.getElementById('projects-list');
    const errorContainer = document.getElementById('error-container');

    async function createProject(type) {
      try {
        const response = await fetch('/api/saas/projects', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type }),
        });

        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error || 'Impossible de créer le projet');
        }

        const data = await response.json();
        // Rediriger vers l'onboarding pour remplir le profil de la levée
        window.location.href = `onboarding-raise.html?project_id=${data.project.id}&type=${type}`;
      } catch (error) {
        console.error('Erreur lors de la création du projet:', error);
        errorContainer.innerHTML = `
          <div class="error-message">
            ${error.message || 'Impossible de créer le projet'}
          </div>
        `;
      }
    }

    // Attacher les gestionnaires d'événements aux boutons
    document.getElementById('btn-new-raise-preference').addEventListener('click', () => {
      createProject('raise-preference');
    });

    document.getElementById('btn-new-bsaair').addEventListener('click', () => {
      createProject('bsaair');
    });

    document.getElementById('btn-new-raise-ordinary').addEventListener('click', () => {
      createProject('raise-ordinary');
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      if (typeof logout === 'function') {
        logout();
      } else {
        window.location.href = 'login.html';
      }
    });

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffTime = Math.abs(now - date);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays === 0) return "aujourd'hui";
      if (diffDays === 1) return "hier";
      if (diffDays < 7) return `il y a ${diffDays} jours`;
      if (diffDays < 30) return `il y a ${Math.floor(diffDays / 7)} semaines`;
      return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Projets actuellement affichés (nécessaire pour le menu ⋮ de chaque carte).
    let currentProjects = [];

    function renderProjects(projects) {
      currentProjects = projects;

      if (projects.length === 0) {
        projectsList.innerHTML = `
          <div class="empty-state">
            <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <h2 class="empty-state__title">Aucun projet pour le moment</h2>
            <p class="empty-state__text">Créez votre première levée de fonds ou BSA AIR pour commencer</p>
          </div>
        `;
        return;
      }

      // Afficher les projets
      projectsList.innerHTML = `
        <div class="projects-grid">
          ${projects.map(project => {
            const typeLabels = {
              'raise-preference': 'Actions de préférence',
              'bsaair': 'BSA AIR',
              'raise-ordinary': 'Actions ordinaires'
            };
            const typeLabel = typeLabels[project.type] || 'Levée de fonds';
            const typeClasses = {
              'raise-preference': 'raise',
              'bsaair': 'bsaair',
              'raise-ordinary': 'ordinary'
            };
            const typeClass = typeClasses[project.type] || 'raise';
            const progress = project.progress || 0;
            // Évite un flash « mauvais type » le temps que le tableau de bord
            // recharge son profil : on connaît déjà le type ici.
            const dashboardRaise = project.type === 'bsaair' ? 'bsa-air' : 'classic';
            const dashboardParams = new URLSearchParams({ project_id: project.id, raise: dashboardRaise });
            if (dashboardRaise === 'classic') dashboardParams.set('step', 'mise-en-ordre');

            return `
              <a href="tableau-de-bord.html?${dashboardParams.toString()}" class="project-card">
                <div class="project-card__header">
                  <div class="project-card__badges">
                    <span class="project-card__type project-card__type--${typeClass}">
                      ${typeLabel}
                    </span>
                  </div>
                  <button class="project-card__menu" onclick="event.preventDefault(); event.stopPropagation(); openProjectMenu(this, ${project.id});">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="1"></circle>
                      <circle cx="12" cy="5" r="1"></circle>
                      <circle cx="12" cy="19" r="1"></circle>
                    </svg>
                  </button>
                </div>

                <div>
                  <h2 class="project-card__name">${project.name || project.company_name || 'Projet sans nom'}</h2>
                  ${project.updated_at ? `
                    <div class="project-card__meta">
                      <div class="project-card__meta-item">
                        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                          <circle cx="12" cy="12" r="10"></circle>
                          <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        Modifié ${formatDate(project.updated_at)}
                      </div>
                    </div>
                  ` : ''}
                </div>

                <div class="project-card__progress">
                  <div class="project-card__progress-label">
                    <span>Progression</span>
                    <strong>${Math.round(progress)}%</strong>
                  </div>
                  <div class="project-card__progress-bar">
                    <div class="project-card__progress-fill" style="width: ${progress}%"></div>
                  </div>
                </div>
              </a>
            `;
          }).join('')}
        </div>
      `;
    }

    async function loadProjects() {
      try {
        const response = await fetch('/api/saas/projects?t=' + Date.now(), { credentials: 'include' });
        if (!response.ok) {
          throw new Error('Impossible de charger les projets');
        }
        const data = await response.json();
        console.log('Projets chargés:', data.projects);
        renderProjects(data.projects || []);
      } catch (error) {
        console.error('Erreur lors du chargement des projets:', error);
        errorContainer.innerHTML = `
          <div class="error-message">
            ${error.message || 'Une erreur est survenue lors du chargement de vos projets'}
          </div>
        `;
        projectsList.innerHTML = `
          <div class="empty-state">
            <h2 class="empty-state__title">Erreur de chargement</h2>
            <p class="empty-state__text">Impossible de charger vos projets. Veuillez réessayer.</p>
          </div>
        `;
      }
    }

    // Menu flottant « ⋮ » de chaque carte projet (renommer / supprimer).
    let projectMenuEl = null;

    function closeProjectMenu() {
      if (projectMenuEl) { projectMenuEl.remove(); projectMenuEl = null; }
      document.removeEventListener('click', onProjectMenuOutside, true);
      window.removeEventListener('scroll', closeProjectMenu, true);
    }

    function onProjectMenuOutside(e) {
      if (projectMenuEl && !projectMenuEl.contains(e.target)) closeProjectMenu();
    }

    function openProjectMenu(anchor, projectId) {
      const alreadyOpenForThisAnchor = projectMenuEl && projectMenuEl.dataset.anchorId === String(projectId);
      closeProjectMenu();
      if (alreadyOpenForThisAnchor) return;

      const project = currentProjects.find(p => p.id === projectId);
      if (!project) return;

      const menu = document.createElement('div');
      menu.className = 'project-menu';
      menu.dataset.anchorId = String(projectId);
      menu.setAttribute('role', 'menu');
      menu.innerHTML = `
        <button type="button" class="project-menu__item" role="menuitem" data-action="rename">
          <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          <span>Renommer</span>
        </button>
        <button type="button" class="project-menu__item project-menu__item--danger" role="menuitem" data-action="delete">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
          <span>Supprimer</span>
        </button>
      `;
      document.body.appendChild(menu);

      const r = anchor.getBoundingClientRect();
      const w = menu.offsetWidth, h = menu.offsetHeight;
      const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
      let top = r.bottom + 6;
      if (top + h > vh - 6) top = Math.max(6, r.top - h - 6);
      const left = Math.max(8, Math.min(r.right - w, vw - w - 8));
      menu.style.top = top + 'px';
      menu.style.left = left + 'px';

      menu.querySelectorAll('.project-menu__item').forEach(item => {
        item.addEventListener('click', () => {
          const action = item.getAttribute('data-action');
          closeProjectMenu();
          if (action === 'rename') renameProject(project);
          if (action === 'delete') deleteProject(project);
        });
      });

      projectMenuEl = menu;
      setTimeout(() => {
        document.addEventListener('click', onProjectMenuOutside, true);
        window.addEventListener('scroll', closeProjectMenu, true);
      }, 0);
    }

    async function renameProject(project) {
      const currentName = project.name || project.company_name || '';
      const newName = (window.prompt('Renommer le projet :', currentName) || '').trim();
      if (newName === currentName || newName === project.name) return;

      try {
        const response = await fetch(`/api/saas/projects/${project.id}`, {
          method: 'PUT',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName }),
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error || 'Impossible de renommer le projet');
        }
        await loadProjects();
      } catch (error) {
        console.error('Erreur lors du renommage du projet:', error);
        errorContainer.innerHTML = `
          <div class="error-message">${error.message || 'Impossible de renommer le projet'}</div>
        `;
      }
    }

    async function deleteProject(project) {
      if (!window.confirm(`Supprimer définitivement « ${project.name || 'ce projet'} » ? Cette action est irréversible.`)) return;

      try {
        const response = await fetch(`/api/saas/projects/${project.id}`, {
          method: 'DELETE',
          credentials: 'include',
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error || 'Impossible de supprimer le projet');
        }
        await loadProjects();
      } catch (error) {
        console.error('Erreur lors de la suppression du projet:', error);
        errorContainer.innerHTML = `
          <div class="error-message">${error.message || 'Impossible de supprimer le projet'}</div>
        `;
      }
    }

    (async function() {
      // Vérifier l'authentification
      const user = await requireAuth('login.html', { requireAccountType: true });
      if (!user) return;

      await loadProjects();
    })();
  </script>
</body>
</html>
