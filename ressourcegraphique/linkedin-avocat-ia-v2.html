<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Une IA peut répondre. Qui en répond ?</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #080c0b;
    }
    .canvas {
      position: relative;
      width: 1080px;
      height: 1080px;
      padding: 70px 76px 66px;
      color: #f7faf8;
      background:
        radial-gradient(circle at 100% 100%, rgba(40, 244, 137, .14), transparent 37%),
        linear-gradient(135deg, #080c0b 0%, #090e0c 60%, #0a1d15 100%);
    }
    .canvas::after {
      content: "§";
      position: absolute;
      right: -15px;
      top: 156px;
      color: rgba(49, 244, 137, .06);
      font-family: Georgia, serif;
      font-size: 670px;
      line-height: 1;
      font-weight: 700;
      transform: rotate(7deg);
    }
    .brand {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 17px;
      font-size: 37px;
      font-weight: 760;
      letter-spacing: -1.2px;
    }
    .brand img {
      width: 28px;
      height: 38px;
      object-fit: contain;
    }
    .plus { color: #31f489; }
    .content {
      position: relative;
      z-index: 2;
      margin-top: 156px;
      max-width: 900px;
    }
    .eyebrow {
      margin-bottom: 38px;
      color: #31f489;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 4.4px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 90px;
      line-height: 1.04;
      letter-spacing: -4.7px;
      font-weight: 800;
    }
    h1 .first {
      display: block;
      color: #f7faf8;
    }
    h1 .question {
      display: block;
      margin-top: 36px;
      color: #31f489;
    }
    .rule {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 1px;
      margin-top: 58px;
      background: linear-gradient(to right, rgba(255,255,255,.28), rgba(255,255,255,0));
    }
    .note {
      position: relative;
      z-index: 2;
      margin-top: 27px;
      color: #adb7b2;
      font-size: 24px;
      letter-spacing: -.2px;
    }
    .footer {
      position: absolute;
      z-index: 2;
      left: 76px;
      right: 76px;
      bottom: 66px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 29px;
      border-top: 1px solid rgba(255,255,255,.16);
      color: #a8b1ad;
      font-size: 22px;
    }
    .footer strong {
      color: #31f489;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="brand">
      <img src="Goutte blanche.png" alt="">
      <span>Liquid<span class="plus">+</span></span>
    </div>

    <section class="content">
      <div class="eyebrow">IA × AVOCATS</div>
      <h1>
        <span class="first">Une IA peut répondre.</span>
        <span class="question">Qui en répond&nbsp;?</span>
      </h1>
      <div class="rule"></div>
      <div class="note">La valeur de l’avocat est-elle en train de se déplacer&nbsp;?</div>
    </section>

    <footer class="footer">
      <span>liquidplus.fr</span>
      <strong>Levées de fonds</strong>
    </footer>
  </main>
</body>
</html>
