<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid+ - Votre lev&eacute;e</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Libre+Franklin:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.svg?v=5" type="image/svg+xml" />
    <style>
      :root { --navy:#001839; --dark:#08090c; --blue:#3b82f6; --muted:#6b6b78; --line:rgba(8,9,12,0.14); }
      * { box-sizing: border-box; }
      body { font-family:'Libre Franklin',system-ui,sans-serif; background:#000; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 16px; margin:0; }
      .auth-wrap { width:100%; max-width:500px; display:flex; flex-direction:column; align-items:center; gap:48px; }
      .auth-logo { display:flex; align-items:center; gap:8px; text-decoration:none; }
      .auth-logo img { height:40px; width:auto; }
      .auth-logo-text { font-family:'Archivo',sans-serif; font-weight:600; font-size:1.4rem; text-transform:uppercase; letter-spacing:0.1em; color:#fff; }
      .auth-card { width:100%; }
      .raise-form { display:flex; flex-direction:column; gap:24px; }
      .raise-grid { display:flex; flex-direction:column; gap:24px; }
      .raise-field { display:flex; flex-direction:column; gap:8px; min-width:0; }
      .raise-field__label { font-family:'Archivo',sans-serif; font-size:13px; font-weight:600; color:#fff; }
      .raise-field__hint { font-size:12px; color:var(--muted); line-height:1.4; }
      .raise-select:disabled { background:#eeeef0; color:#6b6b78; cursor:not-allowed; }
      .raise-input, .raise-select, .raise-textarea { width:100%; font-family:'Libre Franklin',sans-serif; font-size:14px; color:#08090c; background:#f7f7f5; border:1px solid var(--line); border-radius:9px; padding:10px 11px; outline:none; transition:border-color .15s, box-shadow .15s, background .15s; }
      .raise-input:focus, .raise-select:focus, .raise-textarea:focus { background:#fff; border-color:rgba(8,9,12,0.55); box-shadow:0 0 0 3px rgba(8,9,12,0.08); }
      .raise-textarea { min-height:96px; resize:vertical; line-height:1.5; }
      .raise-founders { display:flex; flex-direction:column; gap:10px; }
      .raise-founders__head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
      .raise-founders__title { font-family:'Archivo',sans-serif; font-size:11px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
      .raise-founder-row { display:grid; grid-template-columns:minmax(0, 1.15fr) minmax(150px, .8fr) minmax(0, 1fr) 34px; gap:8px; align-items:center; }
      .raise-founder-remove { width:34px; height:34px; display:grid; place-items:center; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--muted); font-size:18px; line-height:1; cursor:pointer; }
      .raise-founder-remove:hover { border-color:rgba(220,38,38,0.45); color:#dc2626; background:rgba(220,38,38,0.05); }
      .raise-actions { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin-top:4px; }
      .raise-status { font-size:13px; color:var(--muted); margin-right:auto; }
      .raise-status.is-error { color:#dc2626; }
      .raise-status.is-ok { color:#16a34a; }
      .auth-submit, .secondary-btn { border-radius:10px; padding:12px 20px; font-size:0.95rem; font-weight:700; cursor:pointer; font-family:'Libre Franklin',sans-serif; transition:background .18s, border-color .18s, color .18s; }
      .auth-submit { background:var(--dark); color:#fff; border:none; }
      .auth-submit:hover { background:#1a1d24; }
      .auth-submit:disabled { opacity:0.5; cursor:not-allowed; }
      .secondary-btn { background:#fff; color:#08090c; border:1px solid var(--line); }
      .secondary-btn:hover { background:#f7f7f5; border-color:rgba(8,9,12,0.28); }
      .auth-alert { padding:10px 14px; border-radius:8px; font-size:0.88rem; margin-bottom:16px; }
      .auth-alert--error { background:rgba(224,88,72,0.1); color:#c0392b; border:1px solid rgba(224,88,72,0.2); }
      @media (max-width: 720px) {
        body { justify-content:flex-start; }
        .auth-card { padding:30px 22px; }
        .raise-grid { grid-template-columns:1fr; }
        .raise-founder-row { grid-template-columns:1fr; }
        .raise-founder-remove { justify-self:end; }
        .raise-actions { align-items:stretch; }
        .raise-status { width:100%; }
        .auth-submit, .secondary-btn { width:100%; }
      }
    </style>
  </head>
  <body>
    <div class="auth-wrap">
      <a class="auth-logo" href="/index.html">
        <img src="/ressourcegraphique/Goutte%20blanche.png" alt="" />
        <span class="auth-logo-text">LIQUID+</span>
      </a>

      <div class="auth-card">
        <div id="auth-error" class="auth-alert auth-alert--error" role="alert" hidden></div>

        <form class="raise-form" id="raise-form">
          <div class="raise-grid">
            <label class="raise-field">
              <span class="raise-field__label raise-field__label--required">Nom de la soci&eacute;t&eacute;</span>
              <input class="raise-input" name="company_name" type="text" autocomplete="organization" maxlength="160" required />
            </label>
            <label class="raise-field">
              <span class="raise-field__label raise-field__label--required">Pays de r&eacute;sidence de la soci&eacute;t&eacute;</span>
              <select class="raise-select" name="company_country" required>
                <option value="france">France</option>
                <option value="switzerland">Suisse</option>
                <option value="italy">Italie</option>
                <option value="uk">Royaume-Uni</option>
                <option value="us">&Eacute;tats-Unis</option>
                <option value="germany">Allemagne</option>
                <option value="other">Autre</option>
              </select>
            </label>
            <label class="raise-field">
              <span class="raise-field__label">SIREN</span>
              <input class="raise-input" name="company_siren" type="text" maxlength="9" pattern="[0-9]{9}" placeholder="Ex. 123456789" />
            </label>
          </div>

          <div class="raise-actions">
            <span class="raise-status" id="raise-status"></span>
            <button class="auth-submit" id="submit-btn" type="submit">Continuer</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const NEXT = 'tableau-de-bord.html';
      const RAISE_HINTS = { classic: true, 'bsa-air': true };
      // Arrivée depuis « Mes projets » (création d'un nouveau projet) : le type de
      // levée a déjà été choisi là-bas, ce formulaire ne fait que compléter le
      // profil pour CE projet — il ne doit plus laisser le type se re-choisir.
      const urlParams = new URLSearchParams(location.search);
      const PROJECT_ID = urlParams.get('project_id') || '';
      const PROJECT_TYPE = urlParams.get('type') || '';
      function withProjectParam(url) {
        if (!PROJECT_ID) return url;
        return url + (url.includes('?') ? '&' : '?') + 'project_id=' + encodeURIComponent(PROJECT_ID);
      }

      // Convertit le type de projet en type de levée
      function projectTypeToRaiseType(type) {
        if (type === 'bsaair') return 'bsa-air';
        if (type === 'raise-ordinary') return 'ordinary';
        return 'classic';
      }

      const COUNTRIES = ['france', 'switzerland', 'italy', 'us', 'uk', 'germany', 'other'];
      const STATUSES = ['cofounder', 'late-cofounder', 'investor'];
      const DEFAULT_PROFILE = {
        company_name: '',
        company_country: 'france',
        company_siren: '',
        raise_type: PROJECT_TYPE ? projectTypeToRaiseType(PROJECT_TYPE) : 'classic',
        raise_type_locked: false,
        target_amount: '',
        target_valuation: '',
        max_dilution: '',
        target_date: '',
        founders: [],
      };

      const form = document.getElementById('raise-form');
      const errEl = document.getElementById('auth-error');
      const statusEl = document.getElementById('raise-status');
      const submitBtn = document.getElementById('submit-btn');
      const foundersList = document.getElementById('founders-list');
      let currentUser = null;

      function hasAccountType(user) {
        return !!(user && Array.isArray(user.account_types) && user.account_types.length);
      }

      function normalizeProfile(input) {
        const p = input && typeof input === 'object' ? input : {};
        const founders = Array.isArray(p.founders) ? p.founders : [];
        return {
          company_name: String(p.company_name || ''),
          company_country: COUNTRIES.includes(p.company_country) ? p.company_country : DEFAULT_PROFILE.company_country,
          company_siren: String(p.company_siren || ''),
          raise_type: RAISE_HINTS[p.raise_type] ? p.raise_type : DEFAULT_PROFILE.raise_type,
          raise_type_locked: !!p.raise_type_locked,
          target_amount: p.target_amount == null ? '' : String(p.target_amount),
          target_valuation: p.target_valuation == null ? '' : String(p.target_valuation),
          max_dilution: p.max_dilution == null ? '' : String(p.max_dilution),
          target_date: String(p.target_date || ''),
          founders: founders.map(f => ({
            name: String((f && f.name) || ''),
            status: STATUSES.includes(f && f.status) ? f.status : 'cofounder',
            job: String((f && f.job) || ''),
          })).filter(f => f.name || f.job),
        };
      }

      function userKey() {
        return currentUser && (currentUser.id || currentUser.email) || 'me';
      }

      function profileStorageKey() {
        return 'liquid_fundraising_profile_' + userKey();
      }

      function raiseTypeStorageKey() {
        return 'liquid_raise_type_' + userKey();
      }

      function storeProfileLocal(profile) {
        try {
          localStorage.setItem(profileStorageKey(), JSON.stringify(profile));
          localStorage.setItem(raiseTypeStorageKey(), profile.raise_type);
        } catch {}
      }

      function founderRow(founder = {}) {
        const row = document.createElement('div');
        row.className = 'raise-founder-row';
        const select = document.createElement('select');
        select.className = 'raise-select';
        select.dataset.founderStatus = '';
        [
          ['cofounder', 'Co-fondateur'],
          ['late-cofounder', 'Late co-fondateur'],
          ['investor', 'Investisseur'],
        ].forEach(([value, label]) => {
          const opt = document.createElement('option');
          opt.value = value;
          opt.textContent = label;
          if ((founder.status || 'cofounder') === value) opt.selected = true;
          select.appendChild(opt);
        });

        const name = document.createElement('input');
        name.className = 'raise-input';
        name.dataset.founderName = '';
        name.type = 'text';
        name.placeholder = 'Nom';
        name.value = founder.name || '';

        const job = document.createElement('input');
        job.className = 'raise-input';
        job.dataset.founderJob = '';
        job.type = 'text';
        job.placeholder = 'Job dans la soci\u00e9t\u00e9';
        job.value = founder.job || '';

        const remove = document.createElement('button');
        remove.className = 'raise-founder-remove';
        remove.type = 'button';
        remove.setAttribute('aria-label', 'Retirer cette personne');
        remove.title = 'Retirer';
        remove.textContent = '\u00d7';
        remove.addEventListener('click', () => row.remove());

        row.append(name, select, job, remove);
        return row;
      }

      function fillForm(profile) {
        // Ne pré-remplit jamais le formulaire d'onboarding
        form.company_name.value = '';
        form.company_country.value = 'france';
        form.company_siren.value = '';
      }

      function readForm() {
        const founders = Array.from(foundersList.querySelectorAll('.raise-founder-row')).map(row => ({
          name: row.querySelector('[data-founder-name]').value.trim(),
          status: row.querySelector('[data-founder-status]').value,
          job: row.querySelector('[data-founder-job]').value.trim(),
        })).filter(f => f.name || f.job);
        return normalizeProfile({
          company_name: form.company_name.value.trim(),
          company_country: form.company_country.value,
          company_siren: form.company_siren.value.trim(),
          raise_type: PROJECT_TYPE ? projectTypeToRaiseType(PROJECT_TYPE) : 'classic',
          target_amount: '',
          target_valuation: '',
          max_dilution: '',
          target_date: '',
          founders: [],
        });
      }

      function dashboardHref(profile) {
        const params = new URLSearchParams({ raise: profile.raise_type });
        if (profile.raise_type === 'classic') params.set('step', 'mise-en-ordre');
        if (PROJECT_ID) params.set('project_id', PROJECT_ID);
        return NEXT + '?' + params.toString();
      }

      function showError(message) {
        errEl.textContent = message || '';
        errEl.hidden = !message;
      }

      async function loadInitialState() {
        try {
          const meRes = await fetch('/api/auth/me', { credentials: 'include' });
          if (!meRes.ok) { window.location.replace('login.html'); return; }
          const meData = await meRes.json();
          currentUser = meData.user || null;
          if (!hasAccountType(currentUser)) { window.location.replace('onboarding.html'); return; }
          if (currentUser.account_types.includes('avocat') && !currentUser.account_types.includes('fondateur')) {
            window.location.replace(currentUser.lawyer_profile_completed ? 'tableau-de-bord-avocat.html' : 'onboarding-avocat.html');
            return;
          }
        } catch {
          window.location.replace('login.html');
          return;
        }

        let profile = normalizeProfile(DEFAULT_PROFILE);
        try {
          const res = await fetch(withProjectParam('/api/saas/fundraising-profile'), { credentials: 'include' });
          if (res.ok) {
            const data = await res.json();
            profile = normalizeProfile(data.profile || DEFAULT_PROFILE);
          }
        } catch {}
        fillForm(profile);
        storeProfileLocal(profile);
      }

      document.getElementById('add-founder-btn').addEventListener('click', () => {
        foundersList.appendChild(founderRow({}));
      });

      // Empêche la touche Entrée de soumettre prématurément le formulaire
      // depuis un champ texte (le nom/siren semblait alors "disparaître").
      form.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
          e.preventDefault();
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        // Ignore toute soumission implicite (touche Entrée / clavier virtuel mobile) :
        // seul un clic explicite sur le bouton "Continuer" doit valider le formulaire.
        if (!e.submitter) return;
        showError('');
        statusEl.className = 'raise-status';
        statusEl.textContent = '';
        if (!form.reportValidity()) return;

        const profile = readForm();
        if (!profile.company_name || !profile.company_country || !profile.raise_type) {
          statusEl.className = 'raise-status is-error';
          statusEl.textContent = 'Nom de la societe, pays et type de levee sont requis.';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Enregistrement...';
        statusEl.textContent = 'Enregistrement...';
        try {
          const res = await fetch(withProjectParam('/api/saas/fundraising-profile'), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(profile),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Enregistrement impossible.');
          const saved = normalizeProfile(data.profile || profile);
          storeProfileLocal(saved);

          // Met à jour le nom du projet avec le nom de la société si un projet existe
          if (PROJECT_ID && profile.company_name) {
            try {
              await fetch(`/api/saas/projects/${PROJECT_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                  name: profile.company_name,
                  company_name: profile.company_name
                }),
              });
            } catch (err) {
              console.error('Impossible de mettre à jour le nom du projet:', err);
            }
          }

          window.location.href = dashboardHref(saved);
        } catch (err) {
          showError(err.message || 'Impossible de joindre le serveur');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Continuer';
          statusEl.className = 'raise-status is-error';
          statusEl.textContent = '';
        }
      });

      loadInitialState();
    </script>
  </body>
</html>
