<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LIQUID+ — Performance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Libre+Franklin:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <nav class="nav">
        <a class="logo" href="index.html"><img src="/ressourcegraphique/Goutte%20blanche.png" alt="" class="logo-icon"><span class="logo-wordmark">LIQUID+</span></a>
        <div class="nav-links" id="nav-links">
          <a class="nav-link nav-link--active" href="performance.html">Performance</a>
          <a class="nav-link" href="startups.html">Startups</a>
          <a class="nav-link" href="comment-ca-marche.html">Comment ça marche</a>
          <a class="button ghost" href="login.html">Se connecter</a>
        </div>
      </nav>
    </header>

    <script>
      fetch('/api/auth/me', { credentials: 'include' })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (!data?.user) return;
          const name = data.user.full_name ? data.user.full_name.split(' ')[0] : data.user.email;
          document.getElementById('nav-links').innerHTML = `
            <a class="nav-link nav-link--active" href="performance.html">Performance</a>
            <a class="nav-link" href="startups.html">Startups</a>
            <a class="nav-link" href="comment-ca-marche.html">Comment ça marche</a>
            <a class="nav-link" href="investments.html">Mes investissements</a>
            <span class="nav-link nav-user-name">${name}</span>
            <button class="button ghost" id="nav-logout">Se déconnecter</button>
          `;
          document.getElementById('nav-logout').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.reload();
          });
        })
        .catch(() => {});
    </script>

    <main style="padding: 8vh var(--gutter) 10vh;">
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <a class="logo" href="index.html"><img src="/ressourcegraphique/Goutte%20blanche.png" alt="" class="logo-icon"><span class="logo-wordmark">LIQUID+</span></a>
        <p class="footer-copy">© 2026 LIQUID+ · Investissement à risque élevé. Consultez un conseiller financier avant d'investir.</p>
      </div>
    </footer>
    <script src="nav.js"></script>
  </body>
</html>
