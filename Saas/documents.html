<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>liquid + — Documents</title>
  <meta name="description" content="Tous vos documents juridiques de levée de fonds, au même endroit." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="editor.css?v=7" />
  <style>
    [hidden] { display: none !important; }
    .app { height: auto; overflow: visible; display: block; }
    body, .app { background: #08090c !important; }

    /* Topbar noir (identique aux autres pages du SaaS) */
    .topbar { background: #08090c !important; border-bottom: 1px solid rgba(255,255,255,0.07) !important; }
    .topbar .brand { color: #fff !important; display: flex; align-items: center; gap: 8px; }
    .topbar .brand__plus { color: #fff !important; }
    .topbar .brand__logo { display: block; flex: none; }
    .topbar__doc { color: #fff !important; border-left-color: rgba(255,255,255,0.2) !important; }
    .topbar .btn--ghost { color: #fff !important; border-color: rgba(255,255,255,0.35) !important; }
    .topbar .btn--ghost:hover { color: #fff !important; border-color: rgba(255,255,255,0.65) !important; }

    .dil { max-width: 780px; margin: 0 auto; padding: 40px 28px 90px; }
    .dil__eyebrow { font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #fff; }
    .dil__title { font-size: 30px; letter-spacing: -0.03em; color: #fff; margin-top: 6px; }
    .dil__sub { color: rgba(255,255,255,0.7); font-size: 15px; margin-top: 8px; line-height: 1.6; }

    .dil__soon { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 26px 24px; margin-top: 26px; color: rgba(255,255,255,0.85); font-size: 15px; line-height: 1.6; }
    .dil__soon b { color: #fff; }

    .dil__foot { margin-top: 30px; }
  </style>
  <script src="auth.js?v=3"></script>
  <script src="tasks.js?v=2" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__left">
        <a href="/index.html" class="brand"><svg class="brand__logo" width="18" height="22" viewBox="-10 -12 60 76" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M20 2C20 2 2 22 2 34C2 44.5 10 50 20 50C30 50 38 44.5 38 34C38 22 20 2 20 2Z" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/></svg>Liquid <span class="brand__plus">+</span></a>
        <span class="topbar__doc">Documents</span>
      </div>
      <div class="topbar__actions">
        <a href="dossiers.html" class="btn btn--ghost">← Dossiers</a>
        <button class="btn btn--ghost" id="logout-btn">Déconnexion</button>
      </div>
    </header>

    <main class="dil">
      <div class="dil__eyebrow">Outil</div>
      <h1 class="dil__title">Documents</h1>
      <p class="dil__sub">Retrouvez tous les documents de vos dossiers, tous types et toutes étapes confondus, avec leur statut et un accès rapide au téléchargement.</p>

      <div class="dil__soon">
        <b>Bientôt disponible.</b> Cette vue d'ensemble de vos documents est en cours de construction.
      </div>

      <div class="dil__foot">
        <a href="dossiers.html" class="btn btn--ghost">← Retour aux dossiers</a>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('logout-btn').addEventListener('click', (e) => { e.preventDefault(); logout(); });
  </script>
</body>
</html>
