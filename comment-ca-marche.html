  <body style="background:#000; margin:0;">
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header" style="display:none;">
      <nav class="nav">
        <a class="logo" href="index.html"><img src="/ressourcegraphique/Goutte%20blanche.png" alt="" class="logo-icon"><span class="logo-wordmark">LIQUID+</span></a>
        <div class="nav-links" id="nav-links">
          <a class="nav-link" href="marche.html">Ressources</a>

        </div>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button></nav>
    </header>
    <!-- Menu mobile -->
    <div class="mobile-menu" id="mobile-menu" role="dialog" aria-label="Navigation">
      <button class="nav-hamburger" id="mobile-close" aria-label="Fermer" style="position:absolute;top:24px;right:6vw;"><span></span><span></span><span></span></button>
      <a href="index.html">Accueil</a>
      <a href="marche.html">Ressources</a>
      <a href="login.html" style="margin-top:16px; font-size:1.1rem; color:rgba(255,255,255,0.5);">Se connecter</a>
    </div>

    <script>
      (function() {
        var btn   = document.getElementById('nav-hamburger');
        var menu  = document.getElementById('mobile-menu');
        var close = document.getElementById('mobile-close');
        if (!btn || !menu) return;
        function openMenu()  { menu.classList.add('open');  btn.classList.add('open');  btn.setAttribute('aria-expanded','true');  document.body.style.overflow='hidden'; }
        function closeMenu() { menu.classList.remove('open'); btn.classList.remove('open'); btn.setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
        btn.addEventListener('click', openMenu);
        if (close) close.addEventListener('click', closeMenu);
        menu.addEventListener('click', function(e) { if (e.target.tagName === 'A') closeMenu(); });
      })();
    </script>

    <script>
      fetch('/api/auth/me', { credentials: 'include' })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (!data?.user) return;
          const name = data.user.full_name ? data.user.full_name.split(' ')[0] : data.user.email;
          document.getElementById('nav-links').innerHTML = `
            <a class="nav-link" href="marche.html">Ressources</a>
            <a class="nav-link saas-nav-link" href="/saas/tableau-de-bord.html">liquid + SaaS</a>
            <span class="nav-link nav-user-name">${name}</span>
            <button class="button ghost" id="nav-logout">Se déconnecter</button>
          `;
          document.getElementById('nav-logout').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.reload();
          });
        })
        .catch(() => {});
    </script>

    <main style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#000; padding:40px clamp(16px,5vw,24px);">

        <a href="index.html" style="display:flex; align-items:center; justify-content:center; gap:12px; text-decoration:none;">
          <img src="/ressourcegraphique/Goutte%20blanche.png" alt="" style="height:44px; width:auto; filter:invert(1);">
          <span style="font-family:Archivo,sans-serif; font-weight:600; font-size:1.7rem; text-transform:uppercase; letter-spacing:.1em; color:#080c14;">LIQUID+</span>
        </a>
        <div style="display:grid; gap:16px;">
          <h2 style="font-size:1.8rem; font-weight:700; color:#080c14; margin:0;">Page en cours de construction</h2>
          <p style="font-size:1.1rem; color:#5e5e6a; line-height:1.65; margin:0;">Cette page est en cours de construction. Revenez bient&#244;t.</p>
        </div>
        <a href="index.html" style="background:#000; color:#fff; border-radius:12px; padding:16px 28px; font-size:1.05rem; font-weight:700; text-decoration:none; display:block;">Retour &#224; l'accueil</a>
      </div>
    </main>
