<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Liquid+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Libre+Franklin:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/ressourcegraphique/favicon-drop.svg?v=5" />
  <link rel="stylesheet" href="styles.css?v=20260611b" />
  <style>
    :root {
      --bg: #000;
      --text: #f2f1ed;
      --muted: #9c9a94;
      --line: rgba(255,255,255,0.14);
    }
    .admin-wrap { max-width: 1120px; margin: 0 auto; padding: 40px var(--gutter) 80px; }
    .admin-title { font-family: var(--font-heading); font-size: 2rem; font-weight: 400; margin-bottom: 8px; }
    .admin-sub { color: var(--muted); margin-bottom: 48px; font-size: 0.9rem; }

    .admin-section { margin-bottom: 56px; }
    .admin-section h2 { font-family: var(--font-heading); font-size: 1.2rem; font-weight: 400; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

    /* ── Messagerie feedback ── */
    .msg-layout { display: flex; min-height: 360px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.04); }
    .msg-list { width: 250px; flex: none; border-right: 1px solid var(--line); overflow-y: auto; max-height: 520px; }
    .msg-list-item { display: block; width: 100%; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background .12s; }
    .msg-list-item:last-child { border-bottom: 0; }
    .msg-list-item:hover { background: rgba(255,255,255,0.08); }
    .msg-list-item.active { background: rgba(255,255,255,0.12); }
    .msg-list-item__name { font-weight: 600; font-size: 0.86rem; display: flex; align-items: center; gap: 6px; }
    .msg-list-item__dot { width: 8px; height: 8px; border-radius: 50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.16); flex: none; }
    .msg-account-badge { margin-left:auto; padding:3px 7px; border-radius:99px; font:700 .62rem 'Archivo',sans-serif; letter-spacing:.04em; text-transform:uppercase; }
    .msg-account-badge--lawyer { color:#5b21b6; background:#ede9fe; }
    .msg-account-badge--startup { color:#1d4ed8; background:#dbeafe; }
    .msg-list-item__people { margin-top:3px; color:var(--muted); font-size:.72rem; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .msg-list-item__preview { font-size: 0.78rem; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msg-list-item__time { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .msg-panel { flex: 1; display: flex; flex-direction: column; padding: 16px 18px; min-width: 0; }
    .msg-panel__empty { margin: auto; color: var(--muted); font-size: 0.88rem; text-align: center; }
    .msg-panel__head { font-weight: 600; font-size: 0.92rem; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .msg-panel__identity { display:flex; align-items:center; gap:8px; }
    .msg-panel__identity .msg-account-badge { margin-left:0; }
    .msg-panel__details { margin-top:5px; color:var(--muted); font-size:.78rem; font-weight:400; line-height:1.45; }
    .msg-thread { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; margin-bottom: 12px; max-height: 360px; }
    .msg-row { display: flex; }
    .msg-row--out { justify-content: flex-end; }
    .msg-bubble { max-width: 78%; padding: 9px 13px; border-radius: 14px; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg-row--out .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg-row--in .msg-bubble { background: rgba(255,255,255,0.08); color: var(--text); border-bottom-left-radius: 4px; }
    .msg-bubble__time { display: block; font-size: 0.68rem; opacity: 0.65; margin-top: 4px; }
    .msg-reply-form { display: flex; gap: 10px; align-items: flex-end; }
    .msg-reply-form textarea { flex: 1; resize: none; min-height: 42px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); font-family: inherit; font-size: 0.88rem; color: var(--text); }
    .msg-reply-form textarea:focus { outline: none; border-color: var(--accent); }
    .admin-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .admin-card { padding:18px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.04); }
    .admin-card h3 { margin:0 0 8px; font-size:1rem; }
    .admin-card p { margin:4px 0; color:var(--muted); font-size:.82rem; }
    .admin-card select, .admin-card textarea { width:100%; margin-top:10px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; color:var(--text); background:#111; font:inherit; }
    .admin-card textarea { min-height:74px; resize:vertical; }
    .admin-actions { display:flex; gap:8px; align-items:center; margin-top:12px; }
    .admin-pill { display:inline-flex; padding:4px 8px; border:1px solid var(--line); border-radius:99px; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; }
    .proposal-list { display:grid; gap:10px; margin-top:18px; }
    .proposal-row { display:flex; justify-content:space-between; align-items:center; gap:15px; padding:13px 15px; border:1px solid var(--line); border-radius:11px; font-size:.84rem; }
    .proposal-row small { display:block; color:var(--muted); margin-top:4px; }
    .notice { color:var(--muted); font-size:.85rem; }
    .lawyer-tabs { display:flex; flex-wrap:nowrap; gap:4px; margin-bottom:22px; padding:4px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.03); overflow-x:auto; }
    .lawyer-tab { flex:1 0 auto; padding:10px 12px; border:0; border-radius:8px; background:transparent; color:var(--muted); cursor:pointer; font:600 .82rem inherit; white-space:nowrap; }
    .lawyer-tab.is-active { background:#fff; color:#08090c; }
    .lawyer-panel[hidden] { display:none; }
    .assignment-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .assignment-column { min-width:0; }
    .assignment-column h3 { margin:0 0 13px; font-size:.95rem; }
    .choice-list { display:grid; gap:8px; max-height:390px; overflow:auto; }
    .choice-item { display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:rgba(255,255,255,.025); }
    .choice-item:hover { background:rgba(255,255,255,.07); }
    .choice-item:has(input:checked) { border-color:#fff; background:rgba(255,255,255,.1); }
    .choice-item:has(input:disabled) { opacity:.52; cursor:not-allowed; }
    .choice-item input { flex:none; margin-top:3px; }
    .choice-item__name { display:block; font-size:.84rem; font-weight:700; }
    .choice-item__meta { display:block; margin-top:3px; color:var(--muted); font-size:.73rem; line-height:1.4; }
    .assigned-startups { margin-top:13px; padding-top:11px; border-top:1px solid var(--line); }
    .assigned-startups__title { margin-bottom:7px; color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; }
    .assigned-startups__item { display:block; margin-top:5px; font-size:.78rem; }
    .admin-menu-btn { position:fixed; top:9px; left:18px; z-index:92; width:38px; height:38px; display:grid; place-items:center; flex:none; padding:0; border:1px solid var(--line); border-radius:10px; background:#000; color:var(--text); cursor:pointer; }
    .admin-notification-dot { width:9px; height:9px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px #f7f6f3; }
    .admin-menu-btn .admin-notification-dot { position:absolute; top:-2px; right:-2px; }
    .admin-drawer__link .admin-notification-dot { margin-left:auto; flex:none; }
    .admin-notification-dot[hidden] { display:none; }
    .admin-menu-btn:hover { background:rgba(255,255,255,.08); }
    .admin-menu-btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
    .admin-menu-btn--right { right:18px; left:auto; margin-left:0; }
    .nav .nav-inner { width:100%; height:100%; display:flex; align-items:center; gap:14px; padding-left:20px; padding-right:70px; }
    .nav .nav-links { margin-left:auto; gap:8px; }
    .admin-drawer-backdrop { position:fixed; inset:0; z-index:90; visibility:hidden; background:rgba(0,0,0,.28); opacity:0; transition:opacity .18s ease; }
    .admin-drawer-backdrop.is-open { visibility:visible; opacity:1; }
    .admin-drawer { position:fixed; inset-block:0; z-index:91; width:min(280px,88vw); background:#0c0d11; box-shadow:0 0 40px rgba(0,0,0,.5); transition:transform .22s ease; }
    .admin-drawer--right { right:0; border-left:1px solid var(--line); transform:translateX(100%); }
    .admin-drawer.is-open { transform:translateX(0); }
    .admin-drawer__body { padding:68px 12px 16px; }
    .admin-drawer__link { display:flex; align-items:center; gap:12px; width:100%; padding:11px 12px; border-radius:10px; color:var(--text); text-decoration:none; font-size:.88rem; }
    .admin-drawer__link:hover { background:rgba(255,255,255,.08); }
    .admin-drawer__link.is-active { background:rgba(17,17,17,.06); font-weight:700; }
    .admin-drawer__link svg { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    [data-admin-view-panel][hidden] { display:none; }

    /* L'espace administrateur reste toujours en mode clair. */
    :root { color-scheme:light; --bg:#f7f6f3; --text:#111; --muted:#57534a; --line:#e4e0d8; }
    body { background:var(--bg); color:var(--text); }
    .nav { position:sticky; top:0; z-index:70; display:block; width:100%; height:56px; padding:0; background:#f7f6f3; border-bottom:1px solid #ddd9d1; }
    .logo-icon { filter:invert(1); }
    .logo-icon { height:28px; }
    .logo-wordmark { color:var(--text); font-size:18px; text-transform:none; }
    .nav-link { color:var(--text); }
    .nav .button.ghost { height:38px; padding:0 13px; color:var(--text); border-color:rgba(0,0,0,.18); border-radius:10px; font-size:12px; letter-spacing:.04em; }
    .nav .button.ghost:hover { color:var(--text); border-color:rgba(0,0,0,.45); background:rgba(0,0,0,.05); }
    .admin-card, .msg-layout { background:#fff; border-color:#e4e0d8; box-shadow:0 8px 24px rgba(8,9,12,.08); }
    .admin-card select, .admin-card textarea, .msg-reply-form textarea { color:var(--text); background:#fff; border-color:#e4e0d8; }
    .msg-list-item:hover, .msg-list-item.active { background:rgba(17,17,17,.06); }
    .msg-row--in .msg-bubble { background:rgba(17,17,17,.06); color:var(--text); }
    .lawyer-tabs { background:rgba(17,17,17,.035); border-color:rgba(17,17,17,.12); }
    .choice-item { background:#fff; border-color:#e4e0d8; }
    .choice-item:hover, .choice-item:has(input:checked) { background:rgba(17,17,17,.06); }
    .admin-menu-btn { background:transparent; color:var(--text); border-color:rgba(0,0,0,.18); box-shadow:none; }
    .admin-menu-btn:hover { background:rgba(0,0,0,.05); border-color:rgba(0,0,0,.45); }
    .admin-drawer { background:#f7f6f3; border-color:#ddd9d1; box-shadow:0 20px 50px rgba(8,9,12,.14); }
    .admin-drawer__link:hover { background:rgba(17,17,17,.06); }
    .admin-drawer-backdrop { background:rgba(8,9,12,.18); }
    @media (max-width:760px) { .admin-grid, .assignment-grid { grid-template-columns:1fr; } }
    @media (max-width: 640px) { .msg-layout { flex-direction: column; } .msg-list { width: 100%; max-height: 200px; border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html"><img src="/ressourcegraphique/Goutte%20blanche.png" alt="" class="logo-icon"><span class="logo-wordmark">Liquid+</span></a>
      <button type="button" class="admin-menu-btn admin-menu-btn--right" id="admin-menu-right-btn" aria-label="Ouvrir le menu administrateur droit" aria-controls="admin-menu-right" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="admin-notification-dot" id="admin-menu-notification" aria-label="Messages non lus" hidden></span></button>
      <div id="nav-links" class="nav-links">
        <span class="nav-link" id="admin-email" style="color:var(--muted);font-size:.85rem;"></span>
        <button class="button ghost" id="nav-switch-account">Changer de compte</button>
        <button class="button ghost" id="nav-logout">Se déconnecter</button>
      </div>
    </div>
  </nav>

  <div class="admin-drawer-backdrop" id="admin-menu-backdrop"></div>
  <aside class="admin-drawer admin-drawer--right" id="admin-menu-right" aria-label="Menu administrateur droit">
    <nav class="admin-drawer__body">
      <a class="admin-drawer__link" href="/admin.html"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H3Z"/><path d="M9 20v-6h6v6"/></svg>Tableau de bord</a>
      <a class="admin-drawer__link" href="#administrators" data-admin-view="administrators"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-2.8 7.8-7 10-4.2-2.2-7-5.5-7-10V6Z"/><path d="M9 12l2 2 4-4"/></svg>Administrateurs</a>
      <a class="admin-drawer__link" href="#startups" data-admin-view="startups"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 13h14l2 8H3Z"/></svg>Startups</a>
      <a class="admin-drawer__link" href="#lawyers" data-admin-view="lawyers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-6 6-6s6 2 6 6M16 5a3 3 0 0 1 0 6M17 14c3 .3 4 2.3 4 6"/></svg>Avocats</a>
      <a class="admin-drawer__link" href="#messages" data-admin-view="messages"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3Z"/><path d="M8 9h8M8 13h5"/></svg>Messages<span class="admin-notification-dot" id="messages-menu-notification" aria-label="Messages non lus" hidden></span></a>
    </nav>
  </aside>

  <div class="admin-wrap">
    <div class="admin-section" id="admin-administrators" data-admin-view-panel="administrators" hidden>
      <h2>Comptes administrateurs</h2>
      <div class="admin-grid" id="administrator-list"><p class="notice">Chargement…</p></div>
    </div>

    <div class="admin-section" id="admin-startups" data-admin-view-panel="startups">
      <h2>Comptes startups</h2>
      <div class="admin-grid" id="startup-list"><p class="notice">Chargement…</p></div>
    </div>

    <div class="admin-section" id="admin-lawyers" data-admin-view-panel="lawyers" hidden>
      <div class="lawyer-tabs" role="tablist" aria-label="Gestion des avocats">
        <button type="button" class="lawyer-tab is-active" role="tab" aria-selected="true" data-lawyer-tab="accounts">Comptes</button>
        <button type="button" class="lawyer-tab" role="tab" aria-selected="false" data-lawyer-tab="assignment">Attribution des startups</button>
        <button type="button" class="lawyer-tab" role="tab" aria-selected="false" data-lawyer-tab="changes">Demandes de changement</button>
        <button type="button" class="lawyer-tab" role="tab" aria-selected="false" data-lawyer-tab="companies">Vérification sociétés</button>
      </div>

      <section class="lawyer-panel" data-lawyer-panel="accounts">
        <div class="admin-grid" id="lawyer-list"><p class="notice">Chargement…</p></div>
      </section>

      <section class="lawyer-panel" data-lawyer-panel="assignment" hidden>
        <form id="proposal-form">
          <div class="assignment-grid">
            <div class="admin-card assignment-column">
              <h3>Avocats actifs</h3>
              <div class="choice-list" id="proposal-lawyer"><p class="notice">Chargement…</p></div>
            </div>
            <div class="admin-card assignment-column">
              <h3>Startups sans avocat</h3>
              <div class="choice-list" id="proposal-client"><p class="notice">Chargement…</p></div>
            </div>
          </div>
          <div class="admin-card" style="margin-top:18px;">
            <textarea id="proposal-message" maxlength="1000" placeholder="Contexte de la mission (facultatif)"></textarea>
            <div class="admin-actions"><button class="button primary" type="submit">Proposer la mission</button><span class="notice" id="proposal-notice"></span></div>
          </div>
        </form>
        <div class="proposal-list" id="proposal-list"></div>
      </section>

      <section class="lawyer-panel" data-lawyer-panel="changes" hidden>
        <div class="proposal-list" id="lawyer-change-request-list"><p class="notice">Chargement…</p></div>
      </section>
      <section class="lawyer-panel" data-lawyer-panel="companies" hidden>
        <div class="proposal-list" id="company-verification-list"><p class="notice">Chargement…</p></div>
      </section>
    </div>

    <!-- Messagerie feedback -->
    <div class="admin-section" id="admin-feedback" data-admin-view-panel="messages" hidden>
      <div class="msg-layout">
        <div class="msg-list" id="msg-list"><p style="padding:14px;color:var(--muted);font-size:.85rem;">Chargement…</p></div>
        <div class="msg-panel" id="msg-panel"><p class="msg-panel__empty">Sélectionnez une conversation.</p></div>
      </div>
    </div>
  </div>

  <script>
    // Tiroir de navigation administrateur, à droite du bandeau.
    (() => {
      const backdrop = document.getElementById('admin-menu-backdrop');
      const drawers = {
        right: document.getElementById('admin-menu-right'),
      };
      const buttons = {
        right: document.getElementById('admin-menu-right-btn'),
      };
      function closeMenus() {
        Object.values(drawers).forEach(drawer => drawer.classList.remove('is-open'));
        Object.values(buttons).forEach(button => button.setAttribute('aria-expanded', 'false'));
        backdrop.classList.remove('is-open');
      }
      function toggleMenu(side) {
        const willOpen = !drawers[side].classList.contains('is-open');
        closeMenus();
        if (!willOpen) return;
        drawers[side].classList.add('is-open');
        buttons[side].setAttribute('aria-expanded', 'true');
        backdrop.classList.add('is-open');
      }
      buttons.right.addEventListener('click', () => toggleMenu('right'));
      Object.values(drawers).forEach(drawer => drawer.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenus)));
      backdrop.addEventListener('click', closeMenus);
      document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenus(); });
    })();

    const ADMIN_VIEWS = { administrators:'Administrateurs', startups:'Startups', lawyers:'Avocats', messages:'Messages' };
    function showAdminView(view, updateHash = true) {
      if (!ADMIN_VIEWS[view]) view = 'startups';
      document.querySelectorAll('[data-admin-view-panel]').forEach(panel => { panel.hidden = panel.dataset.adminViewPanel !== view; });
      document.querySelectorAll('[data-admin-view]').forEach(link => link.classList.toggle('is-active', link.dataset.adminView === view));
      document.title = ADMIN_VIEWS[view] + ' — Admin Liquid+';
      if (updateHash && window.location.hash !== '#' + view) history.pushState(null, '', '#' + view);
      window.scrollTo({ top:0, behavior:'auto' });
    }
    document.querySelectorAll('[data-admin-view]').forEach(link => link.addEventListener('click', event => {
      event.preventDefault();
      showAdminView(link.dataset.adminView);
    }));
    window.addEventListener('popstate', () => showAdminView(window.location.hash.slice(1), false));
    showAdminView(window.location.hash.slice(1) || 'startups', false);

    // ── Auth check ──────────────────────────────────────────────
    fetch('/api/admin/me', { credentials: 'include' })
      .then(async r => {
        if (r.status === 401) { window.location.href = 'login.html'; return; }
        if (r.status === 403) {
          document.querySelector('.admin-wrap').innerHTML = `
            <div style="padding:60px 0;text-align:center;">
              <p style="font-size:1.1rem;font-weight:600;">Accès refusé</p>
              <p style="color:var(--muted);margin-top:8px;">Votre compte n'a pas les droits administrateur.</p>
              <a href="index.html" class="button" style="margin-top:24px;display:inline-flex;">Retour à l'accueil</a>
            </div>`;
          return;
        }
        if (!r.ok) throw new Error('Erreur serveur ' + r.status);
        const data = await r.json();
        document.getElementById('admin-email').textContent = data.email;
        document.getElementById('nav-logout').addEventListener('click', async () => {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
          window.location.href = 'login.html';
        });
        document.getElementById('nav-switch-account').addEventListener('click', async () => {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
          window.location.href = 'login.html?switch=1';
        });
        loadThreads();
        window.setInterval(loadThreads, 15000);
        loadLawyerManagement();
      })
      .catch(err => {
        document.querySelector('.admin-wrap').innerHTML = `
          <div style="padding:60px 0;text-align:center;">
            <p style="font-size:1.1rem;font-weight:600;color:#e05d3a;">Impossible de contacter le serveur</p>
            <p style="color:var(--muted);margin-top:8px;">Vérifiez que le serveur est démarré (node server.js).</p>
            <a href="index.html" class="button" style="margin-top:24px;display:inline-flex;">Retour à l'accueil</a>
          </div>`;
      });

    // ── Messagerie feedback ──────────────────────────────────────
    function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function fmtMsgTime(iso) { return new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
    function feedbackAccountBadge(thread) {
      const kind = thread.account_kind === 'lawyer' ? 'lawyer' : 'startup';
      return `<span class="msg-account-badge msg-account-badge--${kind}">${escHtml(thread.account_label || (kind === 'lawyer' ? 'Avocat' : 'Startup'))}</span>`;
    }
    function feedbackPeople(thread) {
      return Array.isArray(thread.people_names) ? thread.people_names.filter(Boolean).join(', ') : '';
    }

    let threads = [];
    let activeThreadUserId = null;

    function updateMessageNotifications() {
      const hasUnread = threads.some(thread => thread.unread_by_admin);
      document.getElementById('admin-menu-notification').hidden = !hasUnread;
      document.getElementById('messages-menu-notification').hidden = !hasUnread;
    }

    async function loadThreads() {
      try {
        const r = await fetch('/api/admin/feedback', { credentials: 'include' });
        if (!r.ok) throw new Error();
        const data = await r.json();
        threads = data.threads || [];
        updateMessageNotifications();
        renderThreadList();
      } catch {
        document.getElementById('msg-list').innerHTML = '<p style="padding:14px;color:var(--muted);font-size:.85rem;">Erreur de chargement.</p>';
      }
    }

    function renderThreadList() {
      const el = document.getElementById('msg-list');
      if (!threads.length) { el.innerHTML = '<p style="padding:14px;color:var(--muted);font-size:.85rem;">Aucun message pour l\'instant.</p>'; return; }
      el.innerHTML = threads.map((t, index) => {
        const last = (t.messages && t.messages[0]) || null;
        const name = t.display_name || t.user_name || t.user_email || t.user_id;
        const people = feedbackPeople(t);
        return `<button type="button" class="msg-list-item${t.id === activeThreadId ? ' active' : ''}" data-thread-index="${index}">
          <div class="msg-list-item__name">${t.unread_by_admin ? '<span class="msg-list-item__dot"></span>' : ''}${escHtml(name)}${feedbackAccountBadge(t)}</div>
          ${people && people !== name ? `<div class="msg-list-item__people">${escHtml(people)}</div>` : ''}
          <div class="msg-list-item__preview">${last ? escHtml(last.text) : ''}</div>
          <div class="msg-list-item__time">${last ? fmtMsgTime(last.created_at) : ''}</div>
        </button>`;
      }).join('');
    }

    document.getElementById('msg-list').addEventListener('click', (event) => {
      const item = event.target.closest('[data-thread-index]');
      if (!item) return;
      const thread = threads[Number(item.dataset.threadIndex)];
      if (thread) openThread(thread);
    });

    function renderBubble(m) {
      const out = m.from === 'admin';
      return `<div class="msg-row ${out ? 'msg-row--out' : 'msg-row--in'}"><div class="msg-bubble">${escHtml(m.text)}<span class="msg-bubble__time">${fmtMsgTime(m.created_at)}</span></div></div>`;
    }

    let activeThreadId = null;

    async function openThread(threadSummary) {
      activeThreadId = threadSummary.id;
      activeThreadUserId = threadSummary.user_id;
      renderThreadList();
      const panel = document.getElementById('msg-panel');
      panel.innerHTML = '<p class="msg-panel__empty">Chargement…</p>';
      try {
        const identifier = threadSummary.id || threadSummary.user_id;
        const r = await fetch(`/api/admin/feedback/${encodeURIComponent(identifier)}`, { credentials: 'include' });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          panel.innerHTML = `<p class="msg-panel__empty">Erreur : ${escHtml(err.error || ('HTTP ' + r.status))}</p>`;
          return;
        }
        const data = await r.json();
        threadSummary.unread_by_admin = false;
        updateMessageNotifications();
        renderThreadList();
        renderPanel(data.thread);
      } catch {
        panel.innerHTML = '<p class="msg-panel__empty">Impossible de charger la conversation.</p>';
      }
    }

    function renderPanel(thread) {
      const panel = document.getElementById('msg-panel');
      const name = thread.display_name || thread.user_name || thread.user_email || thread.user_id;
      const people = feedbackPeople(thread);
      const details = [people && people !== name ? people : '', thread.user_email || ''].filter(Boolean).join(' · ');
      panel.innerHTML = `
        <div class="msg-panel__head"><div class="msg-panel__identity">${escHtml(name)}${feedbackAccountBadge(thread)}</div>${details ? `<div class="msg-panel__details">${escHtml(details)}</div>` : ''}</div>
        <div class="msg-thread" id="msg-thread">${(thread.messages || []).map(renderBubble).join('')}</div>
        <form class="msg-reply-form" id="msg-reply-form">
          <textarea id="msg-reply-input" rows="2" placeholder="Répondre…" maxlength="4000"></textarea>
          <button type="submit" class="button primary" id="msg-reply-btn">Répondre</button>
        </form>
      `;
      const threadEl = document.getElementById('msg-thread');
      threadEl.scrollTop = threadEl.scrollHeight;
      document.getElementById('msg-reply-form').addEventListener('submit', sendReply);
    }

    async function sendReply(e) {
      e.preventDefault();
      const input = document.getElementById('msg-reply-input');
      const text = input.value.trim();
      if (!text || !activeThreadUserId) return;
      const btn = document.getElementById('msg-reply-btn');
      btn.disabled = true;
      try {
        const identifier = activeThreadId || activeThreadUserId;
        const r = await fetch(`/api/admin/feedback/${encodeURIComponent(identifier)}`, {
          method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!r.ok) throw new Error();
        input.value = '';
        const active = threads.find(t => t.id === activeThreadId || t.user_id === activeThreadUserId);
        if (active) await openThread(active);
        await loadThreads();
      } catch {
        alert('Erreur lors de l\'envoi de la réponse.');
      } finally {
        btn.disabled = false;
      }
    }

    const LAWYER_STATUS_LABELS = { pending:'À valider', active:'Actif', suspended:'Suspendu', rejected:'Refusé' };
    let adminAdministrators = [], adminLawyers = [], adminFounders = [], adminProposals = [], adminLawyerChangeRequests = [], adminCompanyVerifications = [];
    async function adminJson(url, opts) {
      const r = await fetch(url, Object.assign({ credentials:'include' }, opts || {}));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'Erreur serveur');
      return data;
    }
    async function loadLawyerManagement() {
      try {
        const [a,l,f,p,c,v] = await Promise.all([adminJson('/api/admin/administrators'), adminJson('/api/admin/lawyers'), adminJson('/api/admin/founders'), adminJson('/api/admin/client-proposals'), adminJson('/api/admin/lawyer-change-requests'), adminJson('/api/admin/company-verifications')]);
        adminAdministrators=a.administrators||[]; adminLawyers=l.lawyers||[]; adminFounders=f.founders||[]; adminProposals=p.proposals||[]; adminLawyerChangeRequests=c.requests||[]; adminCompanyVerifications=v.companies||[];
        renderAdministrators(); renderStartups(); renderLawyers(); renderProposalForm(); renderProposals(); renderLawyerChangeRequests(); renderCompanyVerifications();
      } catch(e) { document.getElementById('lawyer-list').innerHTML='<p class="notice">'+escHtml(e.message)+'</p>'; }
    }
    function renderAdministrators() {
      const el=document.getElementById('administrator-list');
      if(!adminAdministrators.length){el.innerHTML='<p class="notice">Aucun compte administrateur.</p>';return;}
      el.innerHTML=adminAdministrators.map(a=>`<article class="admin-card"><h3>${escHtml(a.full_name||a.email)}</h3><p>${escHtml(a.email)}</p><div class="admin-actions"><span class="admin-pill">${a.registered?'Compte actif':'Compte non créé'}</span></div>${a.created_at?`<p>Inscrit le ${new Date(a.created_at).toLocaleDateString('fr-FR')}</p>`:''}</article>`).join('');
    }
    function renderStartups() {
      const el=document.getElementById('startup-list');
      if(!adminFounders.length){el.innerHTML='<p class="notice">Aucun compte startup.</p>';return;}
      el.innerHTML=adminFounders.map(f=>`<article class="admin-card"><h3>${escHtml(f.company_name||f.full_name||f.email)}</h3><p>${escHtml(f.email)}</p><p>Compte créé le ${new Date(f.created_at).toLocaleDateString('fr-FR')}</p><div class="admin-actions"><span class="admin-pill">${f.lawyer_id?'Avocat attribué':f.has_open_proposal?'Proposition en cours':'Sans avocat'}</span></div>${f.lawyer_id?`<div class="assigned-startups"><div class="assigned-startups__title">Avocat</div><span class="assigned-startups__item">${escHtml(f.lawyer_name||'Avocat Liquid+')}</span></div>`:''}</article>`).join('');
    }
    function renderLawyers() {
      const el=document.getElementById('lawyer-list');
      if(!adminLawyers.length){el.innerHTML='<p class="notice">Aucun compte avocat.</p>';return;}
      el.innerHTML=adminLawyers.map(l=>{const startups=l.assigned_startups||[];return `<article class="admin-card"><h3>${escHtml(l.full_name||l.email)}</h3><p>${escHtml(l.email)}</p><p>${escHtml(l.profile?.specialty||'Profil professionnel non complété')} ${l.profile?.city?'· '+escHtml(l.profile.city):''}</p><div class="admin-actions"><span class="admin-pill">${escHtml(LAWYER_STATUS_LABELS[l.lawyer_status]||l.lawyer_status)}</span><select data-lawyer-status="${l.id}" aria-label="Changer le statut"><option value="pending">À valider</option><option value="active">Actif</option><option value="suspended">Suspendu</option><option value="rejected">Refusé</option></select></div><div class="assigned-startups"><div class="assigned-startups__title">Startups attribuées (${startups.length})</div>${startups.length?startups.map(s=>`<span class="assigned-startups__item">${escHtml(s.name)} <small>· ${escHtml(s.email)}</small></span>`).join(''):'<span class="notice">Aucune startup attribuée</span>'}</div></article>`}).join('');
      el.querySelectorAll('[data-lawyer-status]').forEach(s=>{s.value=adminLawyers.find(l=>String(l.id)===s.dataset.lawyerStatus).lawyer_status;s.addEventListener('change',async()=>{try{await adminJson('/api/admin/lawyers/'+s.dataset.lawyerStatus+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});await loadLawyerManagement();}catch(e){alert(e.message);}})});
    }
    function renderProposalForm(){
      const activeLawyers=adminLawyers.filter(l=>l.lawyer_status==='active');
      const unassignedFounders=adminFounders.filter(f=>!f.lawyer_id);
      document.getElementById('proposal-lawyer').innerHTML=activeLawyers.length?activeLawyers.map(l=>`<label class="choice-item"><input type="radio" name="proposal_lawyer" value="${l.id}" required><span><span class="choice-item__name">${escHtml(l.full_name||l.email)}</span><span class="choice-item__meta">${escHtml(l.profile?.specialty||'Spécialité non renseignée')} · ${(l.assigned_startups||[]).length} startup(s)</span></span></label>`).join(''):'<p class="notice">Aucun avocat actif.</p>';
      document.getElementById('proposal-client').innerHTML=unassignedFounders.length?unassignedFounders.map(f=>`<label class="choice-item"><input type="radio" name="proposal_client" value="${f.id}" required ${f.has_open_proposal?'disabled':''}><span><span class="choice-item__name">${escHtml(f.company_name||f.full_name||f.email)}</span><span class="choice-item__meta">${escHtml(f.email)}${f.has_open_proposal?' · Proposition en cours':''}</span></span></label>`).join(''):'<p class="notice">Toutes les startups ont un avocat.</p>';
    }
    function renderProposals(){
      const el=document.getElementById('proposal-list');
      if(!adminProposals.length){el.innerHTML='<p class="notice">Aucune proposition.</p>';return;}
      el.innerHTML=adminProposals.map(p=>`<div class="proposal-row"><div><strong>${escHtml(p.startup_name||p.client_name)}</strong> → ${escHtml(p.lawyer_name)}<small>${escHtml(p.message||'Sans message')} · ${escHtml(p.status)}</small></div>${p.status==='accepted'?`<button class="button primary" data-assign="${escHtml(p.id)}">Attribuer</button>`:''}</div>`).join('');
      el.querySelectorAll('[data-assign]').forEach(b=>b.addEventListener('click',async()=>{try{await adminJson('/api/admin/client-proposals/'+encodeURIComponent(b.dataset.assign)+'/assign',{method:'POST'});await loadLawyerManagement();}catch(e){alert(e.message);}}));
    }
    function renderLawyerChangeRequests(){
      const el=document.getElementById('lawyer-change-request-list');
      if(!adminLawyerChangeRequests.length){el.innerHTML='<p class="notice">Aucune demande de changement d\'avocat.</p>';return;}
      el.innerHTML=adminLawyerChangeRequests.map(r=>`<div class="proposal-row"><div><strong>${escHtml(r.startup_name||r.client_name||r.client_email||'Startup')}</strong><small>Avocat actuel : ${escHtml(r.current_lawyer_name||'Non renseigné')} · ${escHtml(r.reason||'Aucun motif indiqué')} · ${escHtml(r.status||'pending')}</small></div></div>`).join('');
    }
    function renderCompanyVerifications(){
      const el=document.getElementById('company-verification-list');
      if(!adminCompanyVerifications.length){el.innerHTML='<p class="notice">Aucun dossier société soumis.</p>';return;}
      el.innerHTML=adminCompanyVerifications.map(c=>`<div class="proposal-row"><div><strong>${escHtml(c.company_name||'Société sans nom')}</strong><small>SIREN ${escHtml(c.siren||'—')} · ${escHtml(c.legal_form||'—')} · ${escHtml(c.legal_representative_name||'Représentant non renseigné')} · ${escHtml(c.eligibility?.status||c.verification_status||'incomplete')}</small></div><div class="admin-actions">${c.registration_evidence?`<a class="button" href="/api/admin/company-verifications/${c.user_id}/evidence">Justificatif</a>`:''}<button class="button primary" data-company-verify="${c.user_id}" ${c.verification_status==='verified'?'disabled':''}>Valider</button><button class="button" data-company-reject="${c.user_id}">Refuser</button></div></div>`).join('');
      el.querySelectorAll('[data-company-verify]').forEach(b=>b.addEventListener('click',()=>reviewCompany(b.dataset.companyVerify,'verified')));
      el.querySelectorAll('[data-company-reject]').forEach(b=>b.addEventListener('click',()=>reviewCompany(b.dataset.companyReject,'rejected')));
    }
    async function reviewCompany(userId,status){const note=prompt(status==='verified'?'Note de validation (facultative)':'Motif du refus');if(note===null)return;try{await adminJson('/api/admin/company-verifications/'+encodeURIComponent(userId),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,note})});await loadLawyerManagement();}catch(e){alert(e.message);}}
    document.querySelectorAll('[data-lawyer-tab]').forEach(tab=>tab.addEventListener('click',()=>{
      document.querySelectorAll('[data-lawyer-tab]').forEach(item=>{const active=item===tab;item.classList.toggle('is-active',active);item.setAttribute('aria-selected',String(active));});
      document.querySelectorAll('[data-lawyer-panel]').forEach(panel=>{panel.hidden=panel.dataset.lawyerPanel!==tab.dataset.lawyerTab;});
    }));
    document.getElementById('proposal-form').addEventListener('submit',async(e)=>{e.preventDefault();const n=document.getElementById('proposal-notice');const lawyer=document.querySelector('input[name="proposal_lawyer"]:checked');const client=document.querySelector('input[name="proposal_client"]:checked');if(!lawyer||!client){n.textContent='Sélectionnez un avocat et une startup.';return;}n.textContent='Envoi…';try{await adminJson('/api/admin/client-proposals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lawyer_id:Number(lawyer.value),client_id:Number(client.value),message:document.getElementById('proposal-message').value})});document.getElementById('proposal-message').value='';n.textContent='Proposition envoyée.';await loadLawyerManagement();}catch(err){n.textContent=err.message;}});
  </script>
</body>
</html>
