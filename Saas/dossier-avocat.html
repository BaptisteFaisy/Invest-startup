<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid+ — Dossier de relecture</title><link rel="stylesheet" href="theme.css?v=3">
<style>
body{margin:0;background:#f5f6f2;color:#172019;font:14px/1.5 Inter,system-ui,sans-serif}.top{height:62px;background:#132019;color:#fff;display:flex;align-items:center;padding:0 28px;gap:18px}.top a{color:#fff;text-decoration:none}.top strong{font-size:18px}.wrap{max-width:1120px;margin:34px auto;padding:0 20px}.back{color:#365b46;text-decoration:none}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin:18px 0 24px}.head h1{margin:0 0 6px;font-size:30px}.muted{color:#667269}.status{border-radius:999px;background:#e2ebe4;padding:7px 12px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid #dfe4df;border-radius:14px;padding:20px;box-shadow:0 2px 8px #1320190a}.card h2{font-size:17px;margin:0 0 14px}.doc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #edf0ed}.doc:first-of-type{border-top:0}.btn{border:1px solid #bfc9c1;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;color:#172019;text-decoration:none;display:inline-block}.btn.primary{background:#1f5b3b;color:#fff;border-color:#1f5b3b}.btn:disabled{opacity:.5}.messages{height:330px;overflow:auto;border:1px solid #e2e6e2;border-radius:10px;padding:12px;background:#fafbfa}.msg{max-width:82%;margin:8px 0;padding:10px 12px;border-radius:10px;background:#e9eee9}.msg.mine{margin-left:auto;background:#dcecdf}.msg small{display:block;color:#6d786f;margin-top:4px}.composer textarea{width:100%;box-sizing:border-box;margin:10px 0 8px;min-height:80px;border:1px solid #cbd3cc;border-radius:9px;padding:10px;font:inherit}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field select,.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #cbd3cc;border-radius:9px;padding:9px;font:inherit}.notice{padding:12px;border-radius:9px;background:#f4f7f4;margin-bottom:14px}.error{color:#a52626;margin-top:8px}.deliveries a{color:#1f5b3b}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{display:block}.status{display:inline-block;margin-top:10px}}
</style></head><body>
<header class="top"><a id="home" href="avocat.html"><strong>LIQUID+</strong></a><span>Dossier de relecture</span></header>
<main class="wrap"><a class="back" id="back" href="avocat.html">← Retour</a>
<section class="head"><div><h1 id="title">Chargement…</h1><div class="muted" id="meta"></div></div><span class="status" id="status"></span></section>
<div class="grid"><div>
<section class="card"><h2>Documents soumis</h2><div id="docs"></div></section>
<section class="card" style="margin-top:20px"><h2>Documents remis</h2><div class="deliveries" id="deliveries"></div></section>
<section class="card" id="lawyer-tools" style="margin-top:20px" hidden><h2>Traiter la demande</h2>
<div class="field"><label>État du dossier</label><select id="state"><option value="en_cours">Relecture en cours</option><option value="attente_fondateur">Réponse du fondateur attendue</option><option value="cloturee">Dossier clôturé</option></select></div><button class="btn" id="save-state">Mettre à jour</button>
<hr style="border:0;border-top:1px solid #e5e8e5;margin:20px 0"><h2>Remettre une nouvelle version</h2><div class="notice">Choisissez le document source. Le fichier remis sera automatiquement créé comme sa nouvelle version, avec la provenance « avocat ».</div>
<form id="deliver-form"><div class="field"><label>Document source</label><select id="source" required></select></div><div class="field"><label>Fichier révisé (15 Mo max)</label><input id="file" type="file" required></div><div class="field"><label>Message de remise</label><textarea id="delivery-message" maxlength="4000"></textarea></div><button class="btn primary">Remettre au fondateur</button><div class="error" id="deliver-error"></div></form></section>
</div><section class="card"><h2>Échanges</h2><div class="messages" id="messages"></div><div class="composer"><textarea id="message" maxlength="4000" placeholder="Écrivez un message…"></textarea><button class="btn primary" id="send">Envoyer</button><div class="error" id="message-error"></div></div></section></div></main>
<script>
const id=new URLSearchParams(location.search).get('id');let role='founder',data=null;
const esc=v=>{const e=document.createElement('span');e.textContent=v==null?'':String(v);return e.innerHTML};
const labels={soumise:'Soumise',en_cours:'Relecture en cours',attente_fondateur:'Réponse attendue',livree:'Documents remis',cloturee:'Clôturée',annule:'Annulée'};
async function api(url,opt){const r=await fetch(url,Object.assign({credentials:'include'},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erreur serveur');return d}
async function detect(){const me=await api('/api/auth/me');role=me.user?.account_types?.includes('avocat')?'lawyer':'founder';document.getElementById('home').href=role==='lawyer'?'tableau-de-bord-avocat.html':'avocat.html';document.getElementById('back').href=document.getElementById('home').href;document.getElementById('lawyer-tools').hidden=role!=='lawyer'}
function render(){const r=data.request;document.getElementById('title').textContent=r.title||'Relecture juridique';document.getElementById('status').textContent=labels[r.status]||r.status;document.getElementById('meta').textContent=(r.client?((r.client.full_name||r.client.email)+' · '):'')+'Envoyée le '+new Date(r.created_at).toLocaleDateString('fr-FR')+(r.due_date?' · échéance souhaitée '+new Date(r.due_date+'T12:00:00').toLocaleDateString('fr-FR'):'');
document.getElementById('docs').innerHTML=(r.documents||[]).map(d=>`<div class="doc"><div><strong>${esc(d.name)}</strong><div class="muted">${d.size?Math.ceil(d.size/1024)+' Ko':''}</div></div><a class="btn" href="${role==='lawyer'?'/api/lawyer/review-requests/'+r.id+'/documents/'+d.document_id+'/download':'/api/saas/documents/'+d.document_id+'/download'}">Télécharger</a></div>`).join('')||'<p class="muted">Aucun document.</p>';
document.getElementById('deliveries').innerHTML=(r.deliveries||[]).map(d=>`<div class="doc"><div><strong>${esc(d.name)}</strong><div class="muted">Remis le ${new Date(d.delivered_at).toLocaleDateString('fr-FR')}</div></div>${role==='founder'?`<a class="btn" href="/api/saas/documents/${d.document_id}/download">Télécharger</a>`:''}</div>`).join('')||'<p class="muted">Aucun document remis pour le moment.</p>';
document.getElementById('messages').innerHTML=(data.messages||[]).map(m=>`<div class="msg ${m.author_type===role?'mine':''}">${esc(m.body)}<small>${m.author_type==='lawyer'?'Avocat':'Fondateur'} · ${new Date(m.created_at).toLocaleString('fr-FR')}</small></div>`).join('')||'<p class="muted">Aucun message.</p>';document.getElementById('messages').scrollTop=99999;
if(role==='lawyer'){document.getElementById('state').value=['en_cours','attente_fondateur','cloturee'].includes(r.status)?r.status:'en_cours';document.getElementById('source').innerHTML=(r.documents||[]).map(d=>`<option value="${d.document_id}">${esc(d.name)}</option>`).join('')}}
async function load(){await detect();data=await api(role==='lawyer'?'/api/lawyer/review-requests/'+id:'/api/saas/avocat/requests/'+id+'/thread');render()}
document.getElementById('send').onclick=async()=>{const body=document.getElementById('message').value.trim();if(!body)return;try{await api(role==='lawyer'?'/api/lawyer/review-requests/'+id+'/messages':'/api/saas/avocat/requests/'+id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});document.getElementById('message').value='';await load()}catch(e){document.getElementById('message-error').textContent=e.message}};
document.getElementById('save-state').onclick=async()=>{await api('/api/lawyer/review-requests/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:document.getElementById('state').value})});await load()};
document.getElementById('deliver-form').onsubmit=async e=>{e.preventDefault();const fd=new FormData();fd.append('source_document_id',document.getElementById('source').value);fd.append('file',document.getElementById('file').files[0]);fd.append('message',document.getElementById('delivery-message').value);try{const result=await api('/api/lawyer/review-requests/'+id+'/deliver',{method:'POST',body:fd});if(result.unchanged)alert(result.message);e.target.reset();await load()}catch(x){document.getElementById('deliver-error').textContent=x.message}};
load().catch(e=>{document.getElementById('title').textContent='Dossier indisponible';document.getElementById('meta').textContent=e.message});
</script></body></html>
