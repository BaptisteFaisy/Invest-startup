<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startup � LIQUID+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Libre+Franklin:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/ressourcegraphique/favicon-drop.svg" />
  <link rel="stylesheet" href="styles.css?v=20260611b" />
  <style>
    /* ���� Hero ���� */
    .s-hero {
      padding: 72px var(--gutter) 64px;
      border-bottom: 1px solid var(--line);
    }
    .s-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.85rem; color: var(--muted); text-decoration: none;
      margin-bottom: 40px; transition: color .15s;
    }
    .s-back:hover { color: var(--text); }
    .s-hero-top {
      display: flex; align-items: flex-start; gap: 28px;
    }
    .s-logo {
      width: 72px; height: 72px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-heading); font-size: 2rem; font-weight: 500;
      color: #fff; flex-shrink: 0;
    }
    .s-hero-info { flex: 1; }
    .s-name {
      font-family: var(--font-heading); font-size: 2.6rem; font-weight: 400;
      line-height: 1.15; margin-bottom: 10px;
    }
    .s-tagline {
      font-size: 1.1rem; color: var(--muted); margin-bottom: 16px;
    }
    .s-badges { display: flex; flex-wrap: wrap; gap: 8px; }

    /* ���� Stats bar ���� */
    .s-stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1px; background: var(--line);
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    }
    .s-stat {
      background: var(--bg); padding: 28px 32px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .s-stat-value {
      font-family: var(--font-heading); font-size: 1.6rem; font-weight: 400;
    }
    .s-stat-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }

    /* ���� Content ���� */
    .s-body { max-width: 1100px; margin: 0 auto; padding: 64px var(--gutter) 100px; display: grid; gap: 64px; }

    .s-section h2 {
      font-family: var(--font-heading); font-size: 1.3rem; font-weight: 400;
      margin-bottom: 16px;
    }
    .s-section p { color: var(--muted); line-height: 1.75; font-size: 0.97rem; }

    .s-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .s-trio-card {
      background: rgba(255,255,255,0.6); border: 1px solid var(--line);
      border-radius: 16px; padding: 28px;
    }
    .s-trio-card h3 {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: .07em;
      font-weight: 600; color: var(--muted); margin-bottom: 12px;
    }
    .s-trio-card p { font-size: 0.92rem; color: var(--text); line-height: 1.7; }

    /* ���� KPIs ���� */
    .s-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .s-kpi-card {
      background: rgba(255,255,255,0.6); border: 1px solid var(--line);
      border-radius: 14px; padding: 24px 28px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .s-kpi-value {
      font-family: var(--font-heading); font-size: 2rem; font-weight: 400;
    }
    .s-kpi-label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }

    /* ���� Team ���� */
    .s-team { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .s-member {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.6); border: 1px solid var(--line);
      border-radius: 14px; padding: 20px;
    }
    .s-avatar {
      width: 46px; height: 46px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; color: #fff; flex-shrink: 0;
    }
    .s-member-name { font-weight: 600; font-size: 0.95rem; }
    .s-member-role { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

    /* ���� CTA ���� */
    .s-cta {
      border-radius: 20px; padding: 48px 56px;
      display: flex; align-items: center; justify-content: space-between; gap: 32px;
      flex-wrap: wrap;
    }
    .s-cta-text h2 {
      font-family: var(--font-heading); font-size: 1.6rem; font-weight: 400; margin-bottom: 8px;
    }
    .s-cta-text p { color: var(--muted); font-size: 0.95rem; }
    .s-cta-actions { display: flex; gap: 12px; flex-wrap: wrap; }

    .s-divider { height: 1px; background: var(--line); }

    /* ���� Open/closed badge ���� */
    .sc-badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
    .sc-badge.sector { background: rgba(31,142,122,0.1); color: var(--accent-strong); }
    .sc-badge.stage { background: rgba(224,122,79,0.1); color: var(--accent); }
    .sc-badge.open { background: rgba(22,163,74,0.1); color: #16a34a; }
    .sc-badge.closed { background: rgba(111,106,98,0.1); color: var(--muted); }

    /* ���� Loading / error ���� */
    .s-loading { padding: 100px var(--gutter); text-align: center; color: var(--muted); }

    @media (max-width: 700px) {
      .s-stats { grid-template-columns: repeat(2, 1fr); }
      .s-trio { grid-template-columns: 1fr; }
      .s-kpis { grid-template-columns: repeat(2, 1fr); }
      .s-cta { padding: 36px 28px; flex-direction: column; align-items: flex-start; }
      .s-name { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html"><img src="/ressourcegraphique/Goutte%20blanche.png" alt="" class="logo-icon"><span class="logo-wordmark">LIQUID+</span></a>
      <div id="nav-links" class="nav-links">
        <a class="nav-link" href="marche.html">Ressources</a>
        <a class="nav-link" href="login.html">Se connecter</a>
        <a class="button primary" href="register.html">Rejoindre</a>
      </div>
    </div>
  </nav>

  <div id="page-content">
    <div class="s-loading">Chargement⬦</div>
  </div>

  <script>
    // ���� Charger et afficher la startup ������������������������������������������������������������������������
    const params = new URLSearchParams(window.location.search);
    const startupId = Number(params.get('id'));

    if (!startupId) {
      window.location.href = 'startups.html';
    }

    fetch('/api/startups')
      .then(r => r.json())
      .then(({ startups }) => {
        const s = startups.find(x => x.id === startupId);
        if (!s) { window.location.href = 'startups.html'; return; }

        document.title = `${s.name} � LIQUID+`;
        renderPage(s);
      })
      .catch(() => {
        document.getElementById('page-content').innerHTML =
          `<div class="s-loading">Impossible de charger les données. <a href="index.html">Retour aux startups</a></div>`;
      });

    function renderPage(s) {
      document.getElementById('page-content').innerHTML = `
        <!-- Hero -->
        <div class="s-hero">
          <a class="s-back" href="index.html">� � Toutes les startups</a>
          <div class="s-hero-top">
            <div class="s-logo" style="background:${s.color}">${s.emoji || s.name.charAt(0)}</div>
            <div class="s-hero-info">
              <h1 class="s-name">${s.name}</h1>
              <p class="s-tagline">${s.tagline}</p>
              <div class="s-badges">
                <span class="sc-badge sector">${s.sector}</span>
                <span class="sc-badge stage">${s.stage}</span>
                <span class="sc-badge ${s.open ? 'open' : 'closed'}">${s.open ? 'Ouvert aux investisseurs' : 'Tour fermé'}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Stats bar -->
        <div class="s-stats">
          <div class="s-stat">
            <span class="s-stat-value">${s.founded || '�'}</span>
            <span class="s-stat-label">Fondée en</span>
          </div>
          <div class="s-stat">
            <span class="s-stat-value">${s.employees || '�'}</span>
            <span class="s-stat-label">Collaborateurs</span>
          </div>
          <div class="s-stat">
            <span class="s-stat-value">${s.raised || '�'}</span>
            <span class="s-stat-label">Levé à ce jour</span>
          </div>
          <div class="s-stat">
            <span class="s-stat-value">${s.ticket || '�'}</span>
            <span class="s-stat-label">Ticket minimum</span>
          </div>
        </div>

        <!-- Body -->
        <div class="s-body">

          <!-- Description -->
          <div class="s-section">
            <h2>Le projet</h2>
            <p>${s.description}</p>
          </div>

          <div class="s-divider"></div>

          <!-- Problème / Solution / Marché -->
          <div>
            <div class="s-trio">
              ${s.problem ? `
              <div class="s-trio-card">
                <h3>Le problème</h3>
                <p>${s.problem}</p>
              </div>` : ''}
              ${s.solution ? `
              <div class="s-trio-card">
                <h3>La solution</h3>
                <p>${s.solution}</p>
              </div>` : ''}
              ${s.market ? `
              <div class="s-trio-card">
                <h3>Le marché</h3>
                <p>${s.market}</p>
              </div>` : ''}
            </div>
          </div>

          <div class="s-divider"></div>

          <!-- KPIs -->
          ${s.kpis?.length ? `
          <div class="s-section">
            <h2>Chiffres clés</h2>
            <div class="s-kpis">
              ${s.kpis.map(k => `
                <div class="s-kpi-card">
                  <span class="s-kpi-value" style="color:${s.color}">${k.value}</span>
                  <span class="s-kpi-label">${k.label}</span>
                </div>`).join('')}
            </div>
          </div>

          <div class="s-divider"></div>` : ''}

          <!-- �0quipe -->
          ${s.team?.length ? `
          <div class="s-section">
            <h2>L'équipe</h2>
            <div class="s-team">
              ${s.team.map(m => `
                <div class="s-member">
                  <div class="s-avatar" style="background:${m.color}">${m.name.charAt(0)}</div>
                  <div>
                    <p class="s-member-name">${m.name}</p>
                    <p class="s-member-role">${m.role}</p>
                  </div>
                </div>`).join('')}
            </div>
          </div>

          <div class="s-divider"></div>` : ''}

          <!-- CTA investissement -->
          <div class="s-cta" style="background:${s.open ? `${s.color}12` : 'rgba(111,106,98,0.06)'}; border:1px solid ${s.open ? `${s.color}30` : 'var(--line)'};">
            ${s.open ? `
            <div class="s-cta-text">
              <h2>Investir dans ${s.name}</h2>
              <p>Ticket minimum <strong>${s.ticket}</strong> · Tour ouvert aux membres de la plateforme.</p>
            </div>
            <div class="s-cta-actions">
              <a class="button primary" href="register.html">Créer un compte</a>
              <a class="button" href="login.html">Se connecter</a>
            </div>` : `
            <div class="s-cta-text">
              <h2>Tour de financement clôturé</h2>
              <p>Inscrivez-vous pour être alerté des prochaines opportunités.</p>
            </div>
            <div class="s-cta-actions">
              <a class="button primary" href="register.html">S'inscrire</a>
            </div>`}
          </div>

        </div>
      `;
    }

    // ���� Nav auth ��������������������������������������������������������������������������������������������������������������������
    fetch('/api/auth/me', { credentials: 'include' })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (!data?.user) return;
        const name = data.user.full_name ? data.user.full_name.split(' ')[0] : data.user.email;
        document.getElementById('nav-links').innerHTML = `
          <a class="nav-link" href="marche.html">Ressources</a>
          <span class="nav-link nav-user-name">${name}</span>
          <button class="button ghost" id="nav-logout">Se déconnecter</button>
        `;
        document.getElementById('nav-logout').addEventListener('click', async () => {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
          window.location.reload();
        });
      }).catch(() => {});
  </script>
  <script src="nav.js"></script>
</body>
</html>
