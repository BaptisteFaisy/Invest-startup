<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Une IA peut répondre. Qui en répond ?</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
    }
    .canvas {
      position: relative;
      width: 1080px;
      height: 1080px;
      padding: 76px 80px 58px 92px;
      background: #fff;
      border-left: 14px solid #25d67b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 33px;
      font-weight: 800;
      letter-spacing: 1.1px;
    }
    .brand svg {
      width: 34px;
      height: 44px;
      flex: none;
    }
    .content {
      margin-top: 228px;
      max-width: 900px;
    }
    .eyebrow {
      margin: 0 0 33px;
      color: #25d67b;
      font-size: 25px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 900px;
      font-size: 84px;
      line-height: 1.08;
      font-weight: 750;
      letter-spacing: -3.7px;
    }
    h1 span {
      display: block;
    }
    .subtitle {
      margin: 42px 0 0;
      font-size: 31px;
      line-height: 1.3;
      font-weight: 400;
      letter-spacing: -.6px;
    }
    .footer {
      position: absolute;
      left: 92px;
      right: 80px;
      bottom: 58px;
      padding-top: 22px;
      border-top: 1px solid #dedede;
      color: #9ca0a5;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <header class="brand">
      <svg viewBox="0 0 34 44" aria-hidden="true">
        <path d="M17 1.5C17 1.5 2.6 20.2 2.6 29.1C2.6 37.4 8.8 42.5 17 42.5C25.2 42.5 31.4 37.4 31.4 29.1C31.4 20.2 17 1.5 17 1.5Z" fill="#25d67b"/>
      </svg>
      <span>LIQUID+</span>
    </header>

    <section class="content">
      <p class="eyebrow">IA × AVOCATS</p>
      <h1>
        <span>Une IA peut répondre.</span>
        <span>Qui en répond&nbsp;?</span>
      </h1>
      <p class="subtitle">La valeur de l’avocat est-elle en train de se déplacer&nbsp;?</p>
    </section>

    <footer class="footer">liquidplus.fr</footer>
  </main>
</body>
</html>
