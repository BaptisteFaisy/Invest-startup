  </head>
  <body style="background:#000; margin:0;">
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header" style="display:none;">
      <nav class="nav">
        <a class="logo" href="index.html"><img src="/ressourcegraphique/Goutte%20blanche.png" alt="" class="logo-icon"><span class="logo-wordmark">LIQUID+</span></a>
        <div class="nav-links" id="nav-links">
          <a class="nav-link" href="marche.html">Ressources</a>
          <a class="nav-link" href="settings.html">Paramètres</a>
          <a class="button ghost" href="login.html">Se connecter</a>
        </div>
        <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </nav>
    </header>

    <div class="mobile-menu" id="mobile-menu" role="dialog" aria-label="Navigation">
      <button class="nav-hamburger" id="mobile-close" aria-label="Fermer" style="position:absolute;top:24px;right:6vw;"><span></span><span></span><span></span></button>
      <a href="index.html">Accueil</a>
      <a href="marche.html">Ressources</a>
    </div>

    <script>
      (function() {
        var btn   = document.getElementById('nav-hamburger');
        var menu  = document.getElementById('mobile-menu');
        var close = document.getElementById('mobile-close');
        if (!btn || !menu) return;
        function openMenu()  { menu.classList.add('open');  btn.classList.add('open');  btn.setAttribute('aria-expanded','true');  document.body.style.overflow='hidden'; }
        function closeMenu() { menu.classList.remove('open'); btn.classList.remove('open'); btn.setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
        btn.addEventListener('click', openMenu);
        if (close) close.addEventListener('click', closeMenu);
        menu.addEventListener('click', function(e) { if (e.target.tagName === 'A') closeMenu(); });
      })();
    </script>

    <main style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#000; padding:40px clamp(16px,5vw,24px);">
      <div style="display:flex; flex-direction:column; align-items:center; gap:40px; width:100%; max-width:320px;">
        <a href="index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; opacity:1; transition:opacity .2s;">
          <img src="/ressourcegraphique/Goutte%20blanche.png" alt="" style="height:28px; width:auto;">
          <span style="font-family:Archivo,sans-serif; font-weight:700; font-size:1rem; text-transform:uppercase; letter-spacing:.18em; color:#fff;">LIQUID+</span>
        </a>
        <div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.07); border-radius:24px; padding:44px clamp(20px,8vw,48px); width:100%; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;">
          <span style="font-size:2.2rem; line-height:1; margin-bottom:4px;">📊</span>
          <h2 style="font-size:1.1rem; font-weight:800; color:#f4f2ee; margin:0; letter-spacing:-.01em;">Vous n'avez pas encore investi</h2>
          <p style="font-size:0.88rem; color:rgba(255,255,255,0.35); line-height:1.65; margin:0;">Vos investissements apparaîtront<br>ici dès votre premier placement.</p>
        </div>
      </div>
    </main>

    <footer class="site-footer" style="display:none;">
      <div class="footer-inner">
        <a class="logo" href="index.html"><img src="/ressourcegraphique/Goutte%20blanche.png" alt="" class="logo-icon"><span class="logo-wordmark">LIQUID+</span></a>
      </div>
    </footer>
    <script src="nav.js"></script>
